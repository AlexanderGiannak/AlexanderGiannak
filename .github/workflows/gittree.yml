name: Grow GitTree

on:
  schedule:
    - cron: "17 * * * *" # every hour, off the busy top of the hour
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/gittree.yml"]

permissions:
  contents: write

concurrency: # never run two at once; a queued run waits for the current one
  group: gittree
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: AlexanderGiannak/gittree@v1
