name: Grow GitTree

on:
  schedule:
    - cron: "17 9 * * *" # daily, 4:17am Eastern: after your day's contributions are in
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/gittree.yml", "gittree/**"]

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Grow the tree from today's activity
        run: node gittree/tree.mjs --user "${{ github.repository_owner }}" --out assets/tree.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new tree if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tree.svg
          git diff --cached --quiet || (git commit -m "Grow tree [skip ci]" && git push)
